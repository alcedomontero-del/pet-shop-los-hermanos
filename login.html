<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Pet Shop Los Hermanos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo-mark">🔐</div>
      <h1>Panel de administrador</h1>
      <p class="sub">Pet Shop Los Hermanos</p>

      <div id="badge-modo" style="margin-bottom: 18px;"></div>

      <div class="form-error" id="login-error"></div>

      <form id="form-login">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-coral btn-block" id="btn-login">Iniciar sesión</button>
      </form>

      <div class="demo-hint" id="pista-demo" style="display:none;">
        🧪 <strong>Modo demostración:</strong> usa <strong>admin@demo.com</strong> / <strong>demo1234</strong> para entrar. Estos datos solo existen en tu navegador.
      </div>

      <p style="margin-top: 22px;"><a href="index.html" style="color: var(--plum-soft); font-weight: 700; font-size: 13.5px;">← Volver a la tienda</a></p>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
